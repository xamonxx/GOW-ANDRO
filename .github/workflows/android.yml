name: android

on:
  pull_request:
  push:
    branches: [main, gow3, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_PLATFORM: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  GOW3_BUILD_TYPE: Release
  # These paths are intentionally outside the checkout and are never uploaded.
  GOW3_ROOTFS: /data/user/0/com.gow3.android/files/rootfs
  # CI has no game files (no out/eboot.elf), and the CUSA01740 patch addresses are not validated
  # yet (docs/QUICKSTART.md): stage empty patch parts; patches.py still applies the XML patches on
  # the device at start.
  GOW3_SKIP_GAME_PATCH_PARTS: '1'

jobs:
  source-check:
    name: Android source checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Android manifests and packaging tests
        run: |
          python -m unittest \
            discover -s tests -p 'test_android_*.py'
          python -m py_compile tools/android/*.py

  # Kotlin/Java compile errors and launcher unit tests in minutes, before the long native build:
  # the release job waits for this one. No runtime payload or Steam libraries are needed (the
  # Steam stub source set is compiled when they are absent).
  launcher-check:
    name: Android launcher compile and unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      # Every check runs even when an earlier one fails. Reading a job log needs a GitHub sign-in;
      # annotations do not (the run page, the check-run API), so a failing check also reports its
      # error lines there.
      - name: Compile the launcher, run the unit tests and checks
        shell: bash
        env:
          # The debug unit tests need no runtime payload (app/build.gradle.kts stageDebugRuntime).
          GOW3_SKIP_DEBUG_RUNTIME_STAGE: '1'
        run: |
          # The runner starts bash with -e: it would end the step at the first failing check,
          # before that check reports its errors.
          set +e -uo pipefail
          failed=0
          check() {
              local name=$1
              shift
              local log="$RUNNER_TEMP/check.log"
              "$@" 2>&1 | tee "$log"
              local status=${PIPESTATUS[0]}
              [[ $status = 0 ]] && return 0
              local summary
              summary=$({ sed -n '/What went wrong/,/^\* Try/p' "$log"
                          grep -E -A3 '^e: |error:|FAILED|AssertionError|Assertion|Traceback|Error:' "$log"; } | head -n 80)
              [[ -n $summary ]] || summary=$(tail -n 40 "$log")
              summary=${summary//'%'/'%25'}
              summary=${summary//$'\r'/}
              summary=${summary//$'\n'/'%0A'}
              echo "::error title=${name} failed (exit ${status})::${summary:0:6000}"
              failed=1
          }
          # assembleRelease: the release job's own Gradle task, so the APK step cannot fail on
          # launcher sources later.
          check "Launcher build and unit tests" android-launcher/gradlew -p android-launcher --no-daemon \
              :app:assembleRelease :app:testDebugUnitTest
          # gow3.ini as the in-game menu reads and writes it (gpu/CMakeLists.txt graphics-settings-test).
          check "Settings file test" bash -c 'clang++ -std=c++23 -O1 -UNDEBUG -Igpu/shim \
              tests/test_graphics_settings.cpp gpu/shim/gow3_settings.cpp -o "$RUNNER_TEMP/graphics-settings-test" &&
              cd "$RUNNER_TEMP" && ./graphics-settings-test'
          check "Android Python tests" python3 -m unittest discover -s tests -p 'test_android_*.py'
          check "Patch tests" python3 -m unittest discover -s tests -p 'test_patches.py'
          check "run-gow3.sh syntax" bash -c 'bash -n tools/android/device/run-gow3.sh && sh -n tools/android/device/run-gow3.sh'
          exit $failed

  release:
    name: Build signed Android release
    if: github.event_name != 'pull_request'
    needs: launcher-check
    runs-on: ubuntu-24.04
    environment: android-release
    permissions:
      contents: read
    env:
      GOW3_SIGNING: '1'
      GOW3_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GOW3_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GOW3_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOW3_FEXDROID_APK_URL: ${{ vars.GOW3_FEXDROID_APK_URL }}
      GOW3_FEXDROID_APK_SHA256: ${{ vars.GOW3_FEXDROID_APK_SHA256 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Android SDK package cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/platforms/android-${{ env.ANDROID_PLATFORM }}
            /usr/local/lib/android/sdk/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_PLATFORM }}-${{ env.ANDROID_BUILD_TOOLS }}

      - name: Set up native dependency environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Install Android and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang lld llvm cmake ninja-build meson pkg-config patchelf ccache \
            libxml2-utils unzip xz-utils zstd

      - name: Restore reproducible build caches
        uses: actions/cache@v4
        with:
          path: |
            .local-deps/android/arm64-debs
            .local-deps/android/arm64-sysroot
            .local-deps/android/mesa-sysroot
            .local-deps/android/mesa-venv
            .local-deps/android/src
            .local-deps/android/m2
            .local-deps/android/steam-libs
            ~/.cache/ccache
          key: android-${{ runner.os }}-${{ hashFiles('tools/android/**', 'tools/android/mesa-patches/**', 'tools/android/lsfg-patches/**', 'cpu/**', 'gpu/CMakeLists.txt', 'gpu/third_party/**', 'ci/**') }}
          restore-keys: android-${{ runner.os }}-

      - name: Restore fexdroid APK cache
        uses: actions/cache@v4
        with:
          path: .local-deps/android/fexdroid-legacy.apk
          key: fexdroid-apk-${{ vars.GOW3_FEXDROID_APK_SHA256 || '21bed34092f698e39e77138589ebdab8d3498577ffc4fdc3bfef1c711b50d3bf' }}

      - name: Build pinned host dependencies
        shell: bash -el {0}
        run: bash ci/setup-deps.sh "$CONDA_PREFIX"

      - name: Configure temporary paths
        shell: bash
        run: |
          {
            echo "GOW3_KEYSTORE=$RUNNER_TEMP/gow3-release.keystore"
            echo "GOW3_BRIDGE_APK=$GITHUB_WORKSPACE/.local-deps/android/fexdroid-legacy.apk"
          } >> "$GITHUB_ENV"

      - name: Restore signing keystore
        shell: bash
        run: |
          set +x
          # Without the signing secrets (a fork, a new repository) build_release_apk.sh signs with
          # a development key generated for this run: installable for testing, but each run's key
          # differs, so updating an install needs an uninstall first.
          missing=0
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_KEYSTORE_BASE64; do
            if [[ -z ${!name:-} ]]; then
              missing=1
            else
              printf '::add-mask::%s\n' "${!name}"
            fi
          done
          if [[ $missing = 1 ]]; then
            echo '::warning::Android signing secrets are not set; the APK is signed with a development key.'
            exit 0
          fi
          bash tools/android/prepare_signing.sh "$GOW3_KEYSTORE"

      - name: Download and prepare fexdroid rootfs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/android/inputs/fetch_rootfs.py
          test -d .local-deps/android/migration/x/rootfs || {
            echo 'fexdroid rootfs initialization failed' >&2
            exit 1
          }
          test -f "$GOW3_BRIDGE_APK" || {
            echo "Missing verified fexdroid bridge APK at $GOW3_BRIDGE_APK" >&2
            exit 1
          }
          bash tools/android/inputs/fetch_steam_libs.sh
          python3 tools/android/inputs/fetch_arm64_sysroot.py
          python3 tools/android/inputs/fetch_arm64_sysroot.py --out .local-deps/android/mesa-sysroot --packages \
            libc6-dev libstdc++-14-dev libgcc-14-dev linux-libc-dev zlib1g-dev libzstd-dev \
            libexpat1-dev libxcb1-dev libx11-xcb-dev libxcb-xfixes0-dev libxcb-randr0-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-sync-dev libxcb-shm0-dev libxshmfence-dev \
            libx11-dev libxrandr-dev libdrm-dev

      - name: Build ARM64 native runtime
        shell: bash -el {0}
        run: |
          export GOW3_ARM64_HEADERS="$CONDA_PREFIX"
          bash tools/android/build/build_arm64.sh

      - name: Build ARM64 bundle
        shell: bash -el {0}
        run: |
          export GOW3_ARM64_HEADERS="$CONDA_PREFIX"
          clang --target=aarch64-linux-gnu \
            --sysroot=.local-deps/android/arm64-sysroot -O2 -fuse-ld=lld \
            tools/android/build/kgsl_chip_id.c -o out/arm64/kgsl-chip-id
          find .local-deps/android/migration/x/rootfs/usr/lib/aarch64-linux-gnu \
            -type f -printf '%f\n' | sort -u > "$RUNNER_TEMP/device-libs.txt"
          python3 tools/android/build/build_arm64_bundle.py \
            --device-libs "$RUNNER_TEMP/device-libs.txt" \
            --sysroot .local-deps/android/arm64-sysroot

      - name: Build Turnip and LSFG variants
        shell: bash
        run: |
          set -euo pipefail
          # Mesa's meson needs glslangValidator, which the micromamba environment provides; this
          # step does not activate it (its compilers and Python stay the system's), so only append
          # its bin directory.
          env_bin="${MAMBA_ROOT_PREFIX:-$HOME/micromamba}/envs/gow3/bin"
          export PATH="$PATH:$env_bin"
          command -v glslangValidator >/dev/null || { echo "glslangValidator not found (looked in $env_bin)" >&2; exit 1; }
          bash tools/android/build/build_turnip.sh main
          bash tools/android/build/build_turnip.sh gen8
          bash tools/android/build/build_lsfg.sh

      - name: Build, sign, and validate release APK
        shell: bash
        run: |
          set -euo pipefail
          bash tools/android/apk/build_release_apk.sh
          apk=$(find out/release -maxdepth 1 -type f -name '*.apk' -print)
          test -n "$apk" || { echo 'No release APK was produced' >&2; exit 1; }
          test "$(printf '%s\n' "$apk" | wc -l)" -eq 1 || { echo 'Ambiguous release APK output' >&2; exit 1; }
          sha256sum "$apk" > "$apk.sha256"
          echo "APK=$apk" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(cut -d' ' -f1 "$apk.sha256")" >> "$GITHUB_ENV"

      - name: Publish build summary
        run: |
          {
            echo '## Android build/package verified'
            echo
            printf '%s\n' "- Commit: ${GITHUB_SHA}"
            printf '%s\n' "- APK: $(basename "$APK")"
            printf '%s\n' "- SHA-256: ${APK_SHA256}"
            echo '- ABI: `arm64-v8a`'
            echo '- Scope: build, package, signature, and checksum verification only'
            echo '- Not verified by CI: device installation, Vulkan, Turnip/GPU compatibility, and gameplay'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: gow3-android-arm64-${{ github.sha }}
          path: |
            out/release/*.apk
            out/release/*.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set +x
          rm -f -- "$GOW3_KEYSTORE"

  publish-release:
    name: Publish Android release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed APK and checksum
        uses: actions/download-artifact@v4
        with:
          name: gow3-android-arm64-${{ github.sha }}

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
            *.apk.sha256
          generate_release_notes: true

  # Every master build as a GitHub release with the APK as a plain asset. An Actions artifact is
  # always a zip around the APK (itself a zip of ~300 MB), and phone archivers can fail to extract
  # it ("data error"), leaving a truncated APK that Android cannot parse.
  publish-build:
    name: Publish master build
    if: github.ref == 'refs/heads/master'
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: gow3-android-arm64-${{ github.sha }}
          path: artifact

      - name: Name the APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find artifact -maxdepth 1 -type f -name '*.apk' -print)
          test "$(printf '%s\n' "$apk" | wc -l)" -eq 1 || { echo "Expected one APK, got: $apk" >&2; exit 1; }
          # Asset names without spaces keep the download URL and the checksum file plain.
          name="gow3-android-${GITHUB_SHA::7}.apk"
          mv -- "$apk" "$name"
          unzip -tq "$name"
          sha256sum "$name" > "$name.sha256"
          {
            echo "APK_NAME=$name"
            echo "APK_SHA256=$(cut -d' ' -f1 "$name.sha256")"
            echo "APK_BYTES=$(stat -c %s "$name")"
          } >> "$GITHUB_ENV"

      - name: Publish the build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Android build ${{ github.run_number }} (${{ github.sha }})
          prerelease: true
          body: |
            Automatic build of `${{ github.sha }}` on master. Download the `.apk` directly on the
            phone; no extraction needed. Signed with this run's development key when the signing
            secrets are not set: uninstall an earlier build before installing.

            - APK: `${{ env.APK_NAME }}` (${{ env.APK_BYTES }} bytes)
            - SHA-256: `${{ env.APK_SHA256 }}`
          files: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
