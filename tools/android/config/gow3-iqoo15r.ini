# iQOO 15R first-launch profile (run-gow3.sh copies it to gow3.ini when there is none).
# Snapdragon 8 Gen 5 (SM8845: 2x Oryon V3 3.8 GHz + 6x 3.32 GHz), Adreno 829 (Turnip gen8),
# 8 or 12 GB RAM, 1260x2750 AMOLED at up to 144 Hz.
#
# The game runs in the launcher's 1280x720 Xvfb, so output_res stays 1280x720: a larger window is
# clamped to the display and only costs memory. 720p internal + FSR 3.1 at 60 fps leaves thermal
# headroom for long sessions and memory for the 8 GB model; 1080p is "native" on the Home page.

upscaler=fsr3
preset=3
output_res=1280x720
render_resolution=720p
fps_limit=60
engine_fps=60
# 2: the CPU (FEX) prepares the next frame while the GPU draws this one.
frames_queued=2
# run-gow3.sh: the GPU at its top clock while the game draws, and FEX's fast profile.
gpu_boost=1
cpu_mode=fast
# Thermal guard (30 FPS while hot) and helpers off the prime cores.
thermal_guard=1
cpu_placement=1
sustained_perf=1
perf_preset=balanced
display_mode=fullscreen
live_resolution=0
sharpen=0
sharpness=0.50
object_motion=0
show_fps=1
skip_intro=1
debug_camera=0
debug_menu=0
mouse_look=0
overlay_mouse=0

# Lossless Scaling frame generation (needs the player's Lossless.dll): x2 over 60 fps runs the
# panel at 120 Hz (GameActivity picks the display mode).
# lsfg_multiplier=2
# lsfg_flow_scale=0.75
# lsfg_performance=1

# SDL names describe positions (Xbox-style pads: A bottom, B right).
pad.cross=a
pad.circle=b
pad.square=x
pad.triangle=y
pad.l1=leftshoulder
pad.r1=rightshoulder
pad.l2=lefttrigger
pad.r2=righttrigger
pad.l3=leftstick
pad.r3=rightstick
pad.options=start
pad.touchpad=back
pad.up=dpup
pad.down=dpdown
pad.left=dpleft
pad.right=dpright
